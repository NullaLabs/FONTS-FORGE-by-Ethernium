<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07080A" />
      <stop offset="100%" stop-color="#0F1117" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#9D00FF" />
    </linearGradient>
  </defs>

  <rect width="1000" height="320" rx="12" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="1.5"/>
  <rect x="0" y="0" width="1000" height="4" fill="url(#cyanGrad)"/>

  <text x="30" y="38" fill="#00E5FF" font-family="Segoe UI, sans-serif" font-size="12" font-weight="bold" letter-spacing="2">NEMETH CORP // NULLA LABS // PIPELINE DE SILICIO</text>
  <text x="30" y="62" fill="#FFFFFF" font-family="Segoe UI, sans-serif" font-size="16" font-weight="bold">FONTS-FORGE — FLUJO OPERACIONAL</text>

  <!-- Step 1 -->
  <g transform="translate(30, 85)">
    <rect width="215" height="190" rx="8" fill="#0B0D13" stroke="#00E5FF" stroke-width="1.5"/>
    <text x="15" y="30" fill="#00E5FF" font-family="Segoe UI, sans-serif" font-size="18" font-weight="bold">01</text>
    <text x="15" y="55" fill="#FFFFFF" font-family="Segoe UI, sans-serif" font-size="12" font-weight="bold">INGESTIÓN</text>
    <foreignObject x="15" y="65" width="185" height="110">
      <div xmlns="http://www.w3.org/1999/xhtml" style="color: #94A3B8; font-family: Segoe UI, sans-serif; font-size: 10px; line-height: 1.4;">
        Especímenes de glifos en PNG de alta resolución y tablas de codificación PUA
      </div>
    </foreignObject>
  </g>

  <path d="M 255 180 L 270 180 M 265 174 L 272 180 L 265 186" stroke="#00E5FF" stroke-width="2" fill="none"/>

  <!-- Step 2 -->
  <g transform="translate(275, 85)">
    <rect width="215" height="190" rx="8" fill="#0B0D13" stroke="#FF3366" stroke-width="1.5"/>
    <text x="15" y="30" fill="#FF3366" font-family="Segoe UI, sans-serif" font-size="18" font-weight="bold">02</text>
    <text x="15" y="55" fill="#FFFFFF" font-family="Segoe UI, sans-serif" font-size="12" font-weight="bold">GUARDIÁN / VETO</text>
    <foreignObject x="15" y="65" width="185" height="110">
      <div xmlns="http://www.w3.org/1999/xhtml" style="color: #94A3B8; font-family: Segoe UI, sans-serif; font-size: 10px; line-height: 1.4;">
        Verificación de contornos cerrados y normalización de cuadrícula de 1000 UPM
      </div>
    </foreignObject>
  </g>

  <path d="M 500 180 L 515 180 M 510 174 L 517 180 L 510 186" stroke="#9D00FF" stroke-width="2" fill="none"/>

  <!-- Step 3 -->
  <g transform="translate(520, 85)">
    <rect width="215" height="190" rx="8" fill="#0B0D13" stroke="#9D00FF" stroke-width="1.5"/>
    <text x="15" y="30" fill="#9D00FF" font-family="Segoe UI, sans-serif" font-size="18" font-weight="bold">03</text>
    <text x="15" y="55" fill="#FFFFFF" font-family="Segoe UI, sans-serif" font-size="12" font-weight="bold">NÚCLEO SILICIO</text>
    <foreignObject x="15" y="65" width="185" height="110">
      <div xmlns="http://www.w3.org/1999/xhtml" style="color: #94A3B8; font-family: Segoe UI, sans-serif; font-size: 10px; line-height: 1.4;">
        Vectorización por curvas Bézier cuadráticas/cúbicas y simplificación RDP
      </div>
    </foreignObject>
  </g>

  <path d="M 745 180 L 760 180 M 755 174 L 762 180 L 755 186" stroke="#00FF66" stroke-width="2" fill="none"/>

  <!-- Step 4 -->
  <g transform="translate(765, 85)">
    <rect width="205" height="190" rx="8" fill="#0B0D13" stroke="#00FF66" stroke-width="1.5"/>
    <text x="15" y="30" fill="#00FF66" font-family="Segoe UI, sans-serif" font-size="18" font-weight="bold">04</text>
    <text x="15" y="55" fill="#FFFFFF" font-family="Segoe UI, sans-serif" font-size="12" font-weight="bold">TELEMETRÍA / SALIDA</text>
    <foreignObject x="15" y="65" width="175" height="110">
      <div xmlns="http://www.w3.org/1999/xhtml" style="color: #94A3B8; font-family: Segoe UI, sans-serif; font-size: 10px; line-height: 1.4;">
        Archivos `.ttf`, `.woff`, `.woff2` y mapas tipográficos CSS listos para web
      </div>
    </foreignObject>
  </g>
</svg>