<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 240" width="100%" height="240">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&amp;family=Fira+Code:wght@500;700&amp;display=swap');
      
      .title-text {
        font-family: 'Nebula', 'Orbitron', monospace;
        font-weight: 900;
        font-size: 18px;
        fill: #FFFFFF !important;
        stroke: #000000;
        stroke-width: 2px;
        paint-order: stroke fill;
        letter-spacing: 3px;
        filter: drop-shadow(0px 0px 8px #FF8C42CC);
      }

      .subtitle-text {
        font-family: 'Nebula', 'Orbitron', 'Fira Code', monospace;
        font-weight: 700;
        font-size: 13px;
        fill: #FF8C42;
        letter-spacing: 3.5px;
        filter: drop-shadow(0px 0px 6px #FFB347AA);
      }
      
      .badge-text {
        font-family: 'Fira Code', monospace;
        font-size: 10.5px;
        fill: #94A3B8;
        letter-spacing: 2px;
      }
      
      .pulse-dot {
        animation: pulse 1.8s infinite;
      }
      
      @keyframes pulse {
        0% { fill: #00FF9D; opacity: 1; filter: drop-shadow(0 0 6px #00FF9D); }
        50% { fill: #FF8C42; opacity: 0.4; filter: drop-shadow(0 0 2px #FF8C42); }
        100% { fill: #00FF9D; opacity: 1; filter: drop-shadow(0 0 6px #00FF9D); }
      }

      .glow-border {
        animation: borderGlow 4s ease-in-out infinite alternate;
      }

      @keyframes borderGlow {
        0% { stroke: #FF8C42; filter: drop-shadow(0 0 4px #FF8C42); }
        50% { stroke: #FFB347; filter: drop-shadow(0 0 6px #FFB347); }
        100% { stroke: #00FF9D; filter: drop-shadow(0 0 4px #00FF9D); }
      }

      .sheen-anim {
        animation: moveSheen 5s ease-in-out infinite alternate;
      }

      @keyframes moveSheen {
        0% { transform: translateX(-350px); }
        100% { transform: translateX(350px); }
      }
    </style>

    <clipPath id="card-fonts-forge-corner-clip">
      <rect width="950" height="240" rx="16" />
    </clipPath>

    <!-- Engraved Inset 3D Obsidian Base -->
    <linearGradient id="card-fonts-forge-base" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020306" />
      <stop offset="30%" stop-color="#070B14" />
      <stop offset="70%" stop-color="#0A0F1E" />
      <stop offset="100%" stop-color="#010204" />
    </linearGradient>

    <linearGradient id="card-fonts-forge-glass-bevel" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="30%" stop-color="#FF8C42" stop-opacity="0.8" />
      <stop offset="70%" stop-color="#FFB347" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#00FF9D" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="card-fonts-forge-sheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
  </defs>

  <g clip-path="url(#card-fonts-forge-corner-clip)">
    <!-- GENERATIVE 3D PATTERN -->
    <g opacity="0.85">
      <path d="M 80 66.0 Q 230 101.2, 305 87.8 Q 380 109.8, 455 58.0 Q 530 85.2, 605 34.4 Q 680 46.1, 755 34.6 Q 830 22.0, 905 58.6 " stroke="#FF8C42" stroke-width="1.4" fill="none" opacity="0.25"/>
    <circle cx="230.0" cy="89.5" r="3" fill="#FFFFFF" opacity="0.25"><animate attributeName="r" values="3;4.5;3" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="380.0" cy="95.2" r="3" fill="#FFFFFF" opacity="0.25"><animate attributeName="r" values="3;4.5;3" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="530.0" cy="78.8" r="3" fill="#FFFFFF" opacity="0.25"><animate attributeName="r" values="3;4.5;3" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="680.0" cy="52.7" r="3" fill="#FFFFFF" opacity="0.25"><animate attributeName="r" values="3;4.5;3" dur="2.5s" repeatCount="indefinite"/></circle>
    <path d="M 80 84.0 Q 230 128.3, 305 89.9 Q 380 117.6, 455 60.7 Q 530 81.4, 605 49.1 Q 680 47.2, 755 63.9 Q 830 40.8, 905 93.9 " stroke="#FFB347" stroke-width="1.4" fill="none" opacity="0.35"/>
    <circle cx="230.0" cy="113.6" r="3" fill="#FFFFFF" opacity="0.35"><animate attributeName="r" values="3;4.5;3" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="380.0" cy="106.4" r="3" fill="#FFFFFF" opacity="0.35"><animate attributeName="r" values="3;4.5;3" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="530.0" cy="82.2" r="3" fill="#FFFFFF" opacity="0.35"><animate attributeName="r" values="3;4.5;3" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="680.0" cy="59.5" r="3" fill="#FFFFFF" opacity="0.35"><animate attributeName="r" values="3;4.5;3" dur="2.5s" repeatCount="indefinite"/></circle>
    <path d="M 80 102.0 Q 230 144.6, 305 90.7 Q 380 117.1, 455 69.0 Q 530 78.2, 605 72.3 Q 680 57.3, 755 98.1 Q 830 70.3, 905 126.8 " stroke="#FF8C42" stroke-width="1.4" fill="none" opacity="0.45"/>
    <circle cx="230.0" cy="130.4" r="3" fill="#FFFFFF" opacity="0.45"><animate attributeName="r" values="3;4.5;3" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="380.0" cy="112.0" r="3" fill="#FFFFFF" opacity="0.45"><animate attributeName="r" values="3;4.5;3" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="530.0" cy="86.1" r="3" fill="#FFFFFF" opacity="0.45"><animate attributeName="r" values="3;4.5;3" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="680.0" cy="72.2" r="3" fill="#FFFFFF" opacity="0.45"><animate attributeName="r" values="3;4.5;3" dur="2.5s" repeatCount="indefinite"/></circle>
    <path d="M 80 120.0 Q 230 150.4, 305 94.2 Q 380 112.9, 455 85.4 Q 530 80.8, 605 102.8 Q 680 78.3, 755 133.2 Q 830 107.4, 905 153.6 " stroke="#FFB347" stroke-width="1.4" fill="none" opacity="0.55"/>
    <circle cx="230.0" cy="140.3" r="3" fill="#FFFFFF" opacity="0.55"><animate attributeName="r" values="3;4.5;3" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="380.0" cy="115.3" r="3" fill="#FFFFFF" opacity="0.55"><animate attributeName="r" values="3;4.5;3" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="530.0" cy="93.9" r="3" fill="#FFFFFF" opacity="0.55"><animate attributeName="r" values="3;4.5;3" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="680.0" cy="92.2" r="3" fill="#FFFFFF" opacity="0.55"><animate attributeName="r" values="3;4.5;3" dur="2.5s" repeatCount="indefinite"/></circle>
    <path d="M 80 138.0 Q 230 148.8, 305 104.0 Q 380 110.5, 455 110.3 Q 530 93.0, 605 137.6 Q 680 109.6, 755 165.1 Q 830 147.7, 905 172.2 " stroke="#FF8C42" stroke-width="1.4" fill="none" opacity="0.65"/>
    <circle cx="230.0" cy="145.2" r="3" fill="#FFFFFF" opacity="0.65"><animate attributeName="r" values="3;4.5;3" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="380.0" cy="119.6" r="3" fill="#FFFFFF" opacity="0.65"><animate attributeName="r" values="3;4.5;3" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="530.0" cy="108.0" r="3" fill="#FFFFFF" opacity="0.65"><animate attributeName="r" values="3;4.5;3" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="680.0" cy="119.1" r="3" fill="#FFFFFF" opacity="0.65"><animate attributeName="r" values="3;4.5;3" dur="2.5s" repeatCount="indefinite"/></circle>
    <path d="M 80 156.0 Q 230 144.5, 305 122.2 Q 380 114.8, 455 142.0 Q 530 116.2, 605 172.4 Q 680 147.8, 755 190.4 Q 830 185.6, 905 182.4 " stroke="#FFB347" stroke-width="1.4" fill="none" opacity="0.75"/>
    <circle cx="230.0" cy="148.3" r="3" fill="#FFFFFF" opacity="0.75"><animate attributeName="r" values="3;4.5;3" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="380.0" cy="128.5" r="3" fill="#FFFFFF" opacity="0.75"><animate attributeName="r" values="3;4.5;3" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="530.0" cy="129.5" r="3" fill="#FFFFFF" opacity="0.75"><animate attributeName="r" values="3;4.5;3" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="680.0" cy="150.5" r="3" fill="#FFFFFF" opacity="0.75"><animate attributeName="r" values="3;4.5;3" dur="2.5s" repeatCount="indefinite"/></circle>
    </g>

    <!-- Base Frame -->
    <rect width="950" height="240" rx="16" fill="url(#card-fonts-forge-base)" stroke="#000000" stroke-width="4"/>
    
    <!-- Tri-stroke Engraved Inset -->
    <rect x="3" y="3" width="944" height="234" rx="14" fill="none" stroke="#000000" stroke-width="3" opacity="0.9"/>
    <rect x="5" y="5" width="940" height="230" rx="13" fill="none" stroke="url(#card-fonts-forge-glass-bevel)" stroke-width="1.5" />
    <rect x="7" y="7" width="936" height="226" rx="12" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.3" />

    <!-- Moving Light Sheen -->
    <g class="sheen-anim">
      <polygon points="100,0 350,0 150,240 -100,240" fill="url(#card-fonts-forge-sheen)" />
    </g>

    <!-- Corner L-Accents -->
    <path d="M 18 18 L 75 18 M 18 18 L 18 75" class="glow-border" stroke-width="3.5" fill="none" />
    <path d="M 932 18 L 875 18 M 932 18 L 932 75" class="glow-border" stroke-width="3.5" fill="none" />
    <path d="M 18 222 L 75 222 M 18 222 L 18 165" class="glow-border" stroke-width="3.5" fill="none" />
    <path d="M 932 222 L 875 222 M 932 222 L 932 165" class="glow-border" stroke-width="3.5" fill="none" />

    <!-- NULLA-LABS Top Command Bar -->
    <rect x="40" y="20" width="870" height="28" rx="8" fill="#020408" stroke="#000000" stroke-width="2"/>
    <rect x="41" y="21" width="868" height="26" rx="7" fill="none" stroke="#1E293B" stroke-width="1"/>
    
    <circle cx="60" cy="34" r="4.5" class="pulse-dot" />
    <text x="76" y="38" class="badge-text">NULLA-LABS // OFFICIAL ETHERNIUM ENGRAVED OBSIDIAN MONOLITH</text>
    <text x="780" y="38" class="badge-text" fill="#00FF9D">[ENGRAVED_ACTIVE]</text>

    <!-- Title and Subtitle -->
    <g transform="translate(475, 115)">
      <text text-anchor="middle" class="title-text">Fonts Forge — Vector Font Toolkit</text>
    </g>

    <g transform="translate(475, 198)">
      <text text-anchor="middle" class="subtitle-text">AUTONOMOUS ARCHITECTURES • GPU ENGINE • CONTROL SYSTEMS</text>
    </g>

    <line x1="140" y1="216" x2="810" y2="216" stroke="url(#card-fonts-forge-glass-bevel)" stroke-width="2.5" />
  </g>
</svg>